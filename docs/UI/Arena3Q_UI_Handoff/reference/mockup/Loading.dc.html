<script type="text/x-dc" data-dc-script data-props='{"scenario":{"editor":"enum","options":["auto","weak","stall","lost","timeout"],"default":"auto","section":"Kịch bản mạng"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
constructor(p) {
super(p);
this.state = this.initState(p.scenario || 'auto');
}
initState(sc) {
this.live = sc === 'auto';
this.failed = false;
return { pct: sc === 'auto' ? 0 : 63, phase: sc === 'auto' ? 'good' : sc, tipIdx: 0, stallT: 6, attempt: 2, speedV: 2.4, pingV: 32 };
}
componentDidMount() {
this.t = setInterval(() => this.tick(), 120);
this.tt = setInterval(() => this.setState({ tipIdx: this.state.tipIdx + 1 }), 3500);
this.j = setInterval(() => this.jitter(), 700);
this.jitter();
}
componentDidUpdate(prev) {
if ((prev.scenario || 'auto') !== (this.props.scenario || 'auto')) this.setState(this.initState(this.props.scenario || 'auto'));
}
componentWillUnmount() { clearInterval(this.t); clearInterval(this.tt); clearInterval(this.j); }
jitter() {
const ph = this.state.phase, r = Math.random();
if (ph === 'good') this.setState({ speedV: 2.1 + r * 0.5, pingV: 25 + Math.round(r * 22) });
else if (ph === 'weak') this.setState({ speedV: 0.04 + r * 0.14, pingV: 300 + Math.round(r * 220) });
}
tick() {
if (!this.live) return;
const s = this.state;
if (s.phase === 'good') {
if (s.pct >= 100) return;
const next = Math.min(100, s.pct + 1 + Math.floor(Math.random() * 2));
this.setState({ pct: next, phase: (!this.failed && next >= 36) ? 'weak' : 'good' });
} else if (s.phase === 'weak') {
const next = Math.random() < 0.25 ? s.pct + 1 : s.pct;
if (next >= 50) this.setState({ pct: 50, phase: 'stall', stallT: 0, attempt: 1 });
else this.setState({ pct: next });
} else if (s.phase === 'stall') {
const st = s.stallT + 1;
if (st >= 36) { this.failed = true; this.setState({ phase: 'lost' }); }
else this.setState({ stallT: st, attempt: 1 + Math.floor(st / 12) });
} else if (s.phase === 'retry') {
const st = s.stallT + 1;
if (st >= 14) this.setState({ phase: 'good' }); else this.setState({ stallT: st });
}
}
sfx(kind, force) {
if (!force && this.state && this.state.muted) return;
try {
const C = window.AudioContext || window.webkitAudioContext;
if (!this.ac) this.ac = new C();
const ac = this.ac; if (ac.state === 'suspended') ac.resume();
const t = ac.currentTime, sr = ac.sampleRate, out = ac.createGain(); out.gain.value = 0.6; out.connect(ac.destination);
const env = (node, vol, d, dur) => { const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(vol, t + d + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + d + dur); node.connect(g); g.connect(out); };
const tone = (type, f1, f2, dur, vol, d) => { const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f1, t + d); o.frequency.exponentialRampToValueAtTime(f2, t + d + dur); env(o, vol, d, dur); o.start(t + d); o.stop(t + d + dur + 0.05); };
const noise = (dur, vol, d, type, f, f2) => { const n = Math.floor(sr * dur), b = ac.createBuffer(1, n, sr), x = b.getChannelData(0); for (let i = 0; i < n; i++) x[i] = Math.random() * 2 - 1; const s = ac.createBufferSource(), fl = ac.createBiquadFilter(); s.buffer = b; fl.type = type; fl.Q.value = 1.2; fl.frequency.setValueAtTime(f, t + d); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + d + dur); s.connect(fl); env(fl, vol, d, dur); s.start(t + d); };
const pluck = (f, dur, vol, d) => { const n = Math.floor(sr * dur), b = ac.createBuffer(1, n, sr), x = b.getChannelData(0), p = Math.max(2, Math.round(sr / f)), r = new Float32Array(p); for (let i = 0; i < p; i++) r[i] = Math.random() * 2 - 1; let k = 0; for (let i = 0; i < n; i++) { const v = r[k], w = r[(k + 1) % p]; r[k] = (v + w) * 0.4985; x[i] = v; k = (k + 1) % p; } const s = ac.createBufferSource(), hp = ac.createBiquadFilter(), g = ac.createGain(); hp.type = 'highpass'; hp.frequency.value = 180; s.buffer = b; g.gain.value = vol; s.connect(hp); hp.connect(g); g.connect(out); s.start(t + d); };
const drum = (d, vol) => { tone('sine', 140, 48, 0.45, vol, d); noise(0.07, vol * 0.5, d, 'lowpass', 900); };
const P = [293.66, 329.63, 369.99, 440, 493.88, 587.33, 659.25, 739.99, 880, 987.77, 1174.66];
if (kind === 'ok') { drum(0, 0.8); [5, 6, 7, 8, 10].forEach((n, i) => pluck(P[n], 0.7, 0.32, 0.03 + i * 0.045)); }
else if (kind === 'back') { pluck(P[8], 0.4, 0.3, 0); pluck(P[5], 0.5, 0.3, 0.07); }
else { pluck(P[8], 0.45, 0.35, 0); }
} catch (e) {}
}
renderVals() {
const s = this.state, pct = s.pct, ph = s.phase;
const vi = (n, d) => n.toFixed(d).replace('.', ',');
const tips = [
'Thu thập và bồi dưỡng danh tướng, sắp xếp đội hình hợp lý để làm chủ chiến trường!',
'Chọn một tướng rồi chạm vào bản đồ để ra lệnh di chuyển!',
'Mỗi trận triệu hồi tối đa 5 tướng, mỗi tướng dẫn theo một đội quân!',
'Phá hủy nhà chính của đối phương để giành chiến thắng!',
'Dùng tướng khắc hệ Kim, Mộc, Thủy, Hỏa, Thổ để chiếm ưu thế!',
'Liên kết tài khoản để giữ tiến trình khi đổi máy hoặc cài lại game!',
'Chọn máy chủ có trạng thái Tốt để vào trận mượt hơn!'
];
const paused = ph === 'stall' || ph === 'retry' || ph === 'lost' || ph === 'timeout';
const NET = {
good: { bars: 4, col: '#4ade80', type: 'Wi-Fi', ping: s.pingV + ' ms', speed: vi(s.speedV, 1) + ' MB/s', st: 'Ổn định', sc: '#86efac' },
weak: { bars: 2, col: '#f59e0b', type: '4G', ping: s.pingV + ' ms', speed: Math.round(s.speedV * 1000) + ' KB/s', st: 'Mạng yếu', sc: '#fcd34d' },
stall: { bars: 1, col: '#ef4444', type: '4G', ping: '—', speed: '0 KB/s', st: 'Đang kết nối lại…', sc: '#fca5a5', blink: true },
retry: { bars: 1, col: '#f59e0b', type: 'Wi-Fi', ping: '—', speed: '0 KB/s', st: 'Đang thử lại…', sc: '#fcd34d', blink: true },
lost: { bars: 0, col: '#ef4444', type: 'Không có mạng', ping: '—', speed: '0 KB/s', st: 'Mất kết nối', sc: '#fca5a5' },
timeout: { bars: 3, col: '#f59e0b', type: 'Wi-Fi', ping: '> 5000 ms', speed: '0 KB/s', st: 'Máy chủ không phản hồi', sc: '#fca5a5' }
};
const n = NET[ph] || NET.good;
const bars = [6, 9, 12, 14].map((h, i) => ({ style: 'display:inline-block;width:4px;border-radius:1px;height:' + h + 'px;background:' + (i < n.bars ? n.col : '#3a4558') + ';' }));
const stage = ph === 'weak' ? 'Mạng yếu, đang tải chậm…' : paused ? (ph === 'lost' || ph === 'timeout' ? 'Tạm dừng tải' : 'Đang chờ kết nối…') : pct < 20 ? 'Đang kiểm tra phiên bản…' : pct < 90 ? 'Đang tải tài nguyên…' : pct < 100 ? 'Đang kết nối máy chủ…' : 'Hoàn tất! Đang vào game…';
const W = 868, CW = 132, TW = 330;
const fill = Math.round(W * pct / 100);
const cartLeft = Math.min(W - CW + 8, Math.max(-6, fill - CW + 14));
const leftSide = cartLeft - 14 - TW >= 0;
const textLeft = leftSide ? cartLeft - 14 - TW : cartLeft + CW + 14;
const i = s.tipIdx;
const isTimeout = ph === 'timeout';
return {
pct, stage,
loadedMb: vi(215 * pct / 100, 1),
bars, netType: n.type, ping: n.ping, speed: n.speed, statusText: n.st,
statusCls: n.blink ? 'net-blink' : '',
statusStyle: 'font-weight:700;color:' + n.sc + ';',
speedColor: ph === 'good' ? '#f2f5fa' : n.sc,
speedStyle: 'font-size:16px;font-weight:800;text-shadow:0 1px 3px #000;color:' + (ph === 'good' ? '#f2f5fa' : n.sc) + ';',
sig: ph === 'good' || ph === 'timeout' ? 3 : ph === 'lost' ? 0 : 1,
showToast: ph === 'weak',
showSpinner: ph === 'stall' || ph === 'retry',
spinTitle: ph === 'retry' ? 'Đang thử kết nối lại…' : 'Mạng không ổn định, đang kết nối lại…',
spinSub: ph === 'retry' ? 'Vui lòng chờ trong giây lát' : 'Lần thử ' + s.attempt + '/3 · Vui lòng không tắt game',
showPopup: ph === 'lost' || isTimeout,
isTimeout, isLost: !isTimeout,
popTitle: isTimeout ? 'Máy chủ không phản hồi' : 'Mất kết nối mạng',
popMsg: isTimeout ? 'Kết nối tới máy chủ bị gián đoạn hoặc quá thời gian chờ. Vui lòng thử lại sau ít phút.' : 'Không thể kết nối Internet. Vui lòng kiểm tra Wi-Fi hoặc dữ liệu di động rồi thử lại.',
popCode: isTimeout ? 'Mã lỗi: [NET-2002]' : 'Mã lỗi: [NET-1001]',
retry: () => { this.sfx('ok'); this.live = true; this.failed = true; this.setState({ phase: 'retry', stallT: 0 }); },
quit: () => this.sfx('back'),
tip: tips[i % tips.length],
tipClass: i % 2 ? 'a3q-tipA' : 'a3q-tipB',
done: pct >= 100 && ph === 'good',
cartCls: paused ? 'is-paused' : '',
barCls: paused ? 'is-paused' : '',
barStyle: 'position:absolute;left:0;top:0;bottom:0;width:' + pct + '%;border-radius:7px;overflow:hidden;background:linear-gradient(90deg,#8a0f2e,#d61f4f 60%,#ff4f7a);box-shadow:0 0 10px rgba(255,60,110,.7);transition:width .12s linear,filter .3s;filter:' + (paused ? 'grayscale(.6) brightness(.8)' : 'none') + ';',
cartStyle: 'position:absolute;top:0;width:132px;height:84px;left:' + cartLeft + 'px;transition:left .12s linear;',
textStyle: 'position:absolute;top:44px;width:' + TW + 'px;display:flex;gap:10px;align-items:baseline;white-space:nowrap;justify-content:' + (leftSide ? 'flex-end' : 'flex-start') + ';left:' + textLeft + 'px;transition:left .12s linear;'
};
}
}
</script>
</body>
</html>
