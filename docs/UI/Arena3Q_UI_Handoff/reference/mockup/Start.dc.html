<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { muted: false }; }
sfx(kind, force) {
if (!force && this.state && this.state.muted) return;
try {
const C = window.AudioContext || window.webkitAudioContext;
if (!this.ac) this.ac = new C();
const ac = this.ac; if (ac.state === 'suspended') ac.resume();
const t = ac.currentTime, sr = ac.sampleRate, out = ac.createGain(); out.gain.value = 0.6; out.connect(ac.destination);
const env = (node, vol, d, dur) => { const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(vol, t + d + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + d + dur); node.connect(g); g.connect(out); };
const tone = (type, f1, f2, dur, vol, d) => { const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f1, t + d); o.frequency.exponentialRampToValueAtTime(f2, t + d + dur); env(o, vol, d, dur); o.start(t + d); o.stop(t + d + dur + 0.05); };
const noise = (dur, vol, d, type, f, f2) => { const n = Math.floor(sr * dur), b = ac.createBuffer(1, n, sr), x = b.getChannelData(0); for (let i = 0; i < n; i++) x[i] = Math.random() * 2 - 1; const s = ac.createBufferSource(), fl = ac.createBiquadFilter(); s.buffer = b; fl.type = type; fl.Q.value = 1.2; fl.frequency.setValueAtTime(f, t + d); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + d + dur); s.connect(fl); env(fl, vol, d, dur); s.start(t + d); };
const pluck = (f, dur, vol, d) => { const n = Math.floor(sr * dur), b = ac.createBuffer(1, n, sr), x = b.getChannelData(0), p = Math.max(2, Math.round(sr / f)), r = new Float32Array(p); for (let i = 0; i < p; i++) r[i] = Math.random() * 2 - 1; let k = 0; for (let i = 0; i < n; i++) { const v = r[k], w = r[(k + 1) % p]; r[k] = (v + w) * 0.4985; x[i] = v; k = (k + 1) % p; } const s = ac.createBufferSource(), hp = ac.createBiquadFilter(), g = ac.createGain(); hp.type = 'highpass'; hp.frequency.value = 180; s.buffer = b; g.gain.value = vol; s.connect(hp); hp.connect(g); g.connect(out); s.start(t + d); };
const drum = (d, vol) => { tone('sine', 140, 48, 0.45, vol, d); noise(0.07, vol * 0.5, d, 'lowpass', 900); };
const gong = (d, vol) => { [1, 1.48, 2.1, 2.6, 3.4, 4.2].forEach((m, i) => { const o = ac.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(110 * m * 1.01, t + d); o.frequency.exponentialRampToValueAtTime(110 * m, t + d + 0.4); env(o, vol / (1 + i * 0.7), d, 2.2 - i * 0.25); o.start(t + d); o.stop(t + d + 2.4); }); noise(0.12, vol * 0.25, d, 'bandpass', 2500); };
const wood = (f, d, vol) => { tone('sine', f, f * 0.92, 0.07, vol, d); tone('triangle', f * 2.7, f * 2.5, 0.03, vol * 0.35, d); noise(0.015, vol * 0.4, d, 'bandpass', f * 3); };
const sword = (d, vol) => { noise(0.26, vol, d, 'bandpass', 1400, 7500); tone('sine', 2600, 2580, 0.6, vol * 0.12, d + 0.18); tone('sine', 3900, 3880, 0.5, vol * 0.08, d + 0.18); };
const P = [293.66, 329.63, 369.99, 440, 493.88, 587.33, 659.25, 739.99, 880, 987.77, 1174.66];
if (kind === 'enter') { drum(0, 0.9); drum(0.16, 0.7); sword(0.02, 0.35); gong(0.3, 0.35); }
else if (kind === 'ok') { drum(0, 0.8); [5, 6, 7, 8, 10].forEach((n, i) => pluck(P[n], 0.7, 0.32, 0.03 + i * 0.045)); }
else if (kind === 'tab') { wood(980, 0, 0.5); }
else if (kind === 'back') { pluck(P[8], 0.4, 0.3, 0); pluck(P[5], 0.5, 0.3, 0.07); }
else if (kind === 'err') { wood(420, 0, 0.6); wood(380, 0.12, 0.6); }
else { pluck(P[8], 0.45, 0.35, 0); }
} catch (e) {}
}
renderVals() {
const muted = this.state.muted;
return {
muted,
mutedStr: muted ? 'true' : 'false',
soundLabel: muted ? 'Bật âm thanh' : 'Tắt âm thanh',
toggleSound: () => { const m = !this.state.muted; this.setState({ muted: m }); if (!m) this.sfx('tap', true); },
tap: () => this.sfx('tap'), ok: () => this.sfx('ok'), enter: () => this.sfx('enter'), back: () => this.sfx('back')
};
}
}
</script>
