<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a1424">
  <meta name="description" content="Chơi Arena3Q trên web. Tự chọn hiển thị điện thoại, iPad hoặc PC.">
  <title>Arena3Q</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="art/logo.png">
</head>
<body>
  <header class="toolbar">
    <img class="brand" src="art/logo.png" alt="Arena3Q">
    <fieldset id="modes" aria-label="Kiểu hiển thị">
      <legend class="sr-only">Kiểu hiển thị</legend>
    </fieldset>
    <label id="phone-control" class="preview-control" hidden>Màn hình
      <select id="phone-device" aria-label="Màn hình điện thoại"></select>
    </label>
    <label class="preview-control">Hiển thị
      <select id="display-preset" aria-label="Cấu hình hiển thị"></select>
    </label>
    <button id="fullscreen" class="ui-btn blue utility" type="button">Toàn màn hình</button>
  </header>
  <main id="play-area" aria-label="Arena3Q">
    <section id="game-frame" aria-label="Màn hình game">
      <canvas id="unity-canvas" width="1600" height="900" tabindex="0" aria-label="Game Arena3Q. Dùng chuột hoặc chạm để chơi."></canvas>
      <div id="cover">
        <div class="cover-shade"></div>
        <div class="welcome">
          <img class="welcome-logo" src="art/logo.png" alt="Arena3Q">
          <div class="panel">
            <img class="crest" src="art/crest.png" alt="">
            <h1 id="title">Sẵn sàng xuất chinh</h1>
            <p id="status" role="status" aria-live="polite">Chọn kiểu hiển thị và bắt đầu hành trình.</p>
            <div id="loading" hidden>
              <div class="track"><div id="progress" role="progressbar" aria-label="Tải game" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div></div>
              <span id="percent">0%</span>
            </div>
            <button id="start" class="ui-btn gold" type="button">VÀO GAME</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer><span id="mode-label">PC</span><span id="hint">Chọn thẻ để triệu hồi tướng. Kéo bản đồ để di chuyển góc nhìn.</span></footer>
  <script type="module" src="player.mjs"></script>
</body>
</html>
