name: arena3q-admin
services:
  api:
    build: { context: ., target: api }
    init: true
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      ADMIN_ROOT: /workspace/Admin
      DATABASE_DRIVER: ${DATABASE_DRIVER:-json}
      DATABASE_URL: ${DATABASE_URL:-}
      JSON_DB_PATH: .local/db.json
      LOCAL_STORAGE_PATH: .local/storage
      ADMIN_ORIGINS: ${ADMIN_ORIGINS:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      REDIS_URL: ${REDIS_URL:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes: [./.local:/workspace/Admin/.local]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    build: { context: ., target: web }
    init: true
    restart: unless-stopped
    depends_on: { api: { condition: service_healthy } }
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    volumes: [./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [web, api]
  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arena3q}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-before-deploy}
      POSTGRES_DB: ${POSTGRES_DB:-arena3q_admin}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7.4-alpine
    profiles: [redis]
    command: [redis-server, --appendonly, "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis-data:/data]
volumes:
  postgres-data:
  redis-data:
